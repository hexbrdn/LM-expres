<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 130" width="520" height="130">
  <defs>
    <linearGradient id="redFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c81e1e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#e21e1e" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Speed lines -->
  <rect x="10" y="34" width="60" height="7" rx="3.5" fill="url(#redFade)"/>
  <rect x="30" y="48" width="90" height="7" rx="3.5" fill="url(#redFade)"/>
  <rect x="55" y="62" width="120" height="7" rx="3.5" fill="url(#redFade)"/>

  <!-- Wordmark: dark fill + subtle light stroke so it reads on both light and dark backgrounds -->
  <text x="20" y="105" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900"
        fill="#1a1a1a" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">
    LM<tspan fill="#e21e1e">EXPRESS</tspan>
  </text>

  <!-- Subline -->
  <text x="22" y="122" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" letter-spacing="3"
        fill="#4d4d4d" stroke="#ffffff" stroke-width="0.6" paint-order="stroke">
    KURIER &amp; EXPRESSDIENST
  </text>
</svg>

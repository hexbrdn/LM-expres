<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d084;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a86b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="#f0f9f5"/>
  
  <!-- Pharmacy Bottle - Main Container -->
  <rect x="120" y="80" width="160" height="180" rx="12" fill="url(#grad)" filter="url(#shadow)"/>
  
  <!-- Bottle Cap -->
  <rect x="130" y="60" width="140" height="30" rx="6" fill="#00a86b"/>
  <rect x="135" y="50" width="130" height="15" rx="4" fill="#00c878"/>
  
  <!-- Label on Bottle -->
  <rect x="135" y="120" width="130" height="90" rx="4" fill="#ffffff" opacity="0.9"/>
  <circle cx="200" cy="145" r="18" fill="#ff6b9d"/>
  <path d="M200 135 L200 155 M190 145 L210 145" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Pills/Capsules Floating -->
  <!-- Left Capsule -->
  <ellipse cx="90" cy="200" rx="20" ry="14" fill="#ff6b9d" filter="url(#shadow)"/>
  <circle cx="80" cy="200" r="14" fill="#ff8fb4"/>
  
  <!-- Right Capsule -->
  <ellipse cx="310" cy="220" rx="18" ry="12" fill="#ffd700" filter="url(#shadow)"/>
  <circle cx="322" cy="220" r="12" fill="#ffed4e"/>
  
  <!-- Top Floating Pill -->
  <circle cx="200" cy="30" r="16" fill="#ff6b9d" filter="url(#shadow)"/>
  <circle cx="200" cy="30" r="8" fill="#ff8fb4"/>
  
  <!-- Emoji Label -->
  <text x="200" y="360" font-size="48" font-family="Arial, sans-serif" text-anchor="middle" fill="#00a86b" font-weight="bold">💊 PHARMACY</text>
  <rect x="75" y="130" width="50" height="8" rx="2" fill="#ffa500"/>
  <text x="100" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f3a5f">Apotheke</text>
</svg>

<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="crGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d5a8c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f3a5f;stop-opacity:1" />
    </linearGradient>
    <filter id="crShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="#f5f9ff"/>
  <g filter="url(#crShadow)">
    <!-- Car body -->
    <path d="M 100 200 L 120 120 Q 120 100 140 100 L 260 100 Q 280 100 280 120 L 300 200 Z" fill="url(#crGrad)" stroke="#0066ff" stroke-width="3"/>
    <!-- Car base -->
    <rect x="90" y="200" width="220" height="50" rx="8" fill="#0052cc" stroke="#0066ff" stroke-width="2"/>
    <!-- Windshield -->
    <path d="M 140 120 L 160 110 L 160 155 L 140 145 Z" fill="#e8f8ff" opacity="0.7" stroke="#00d4ff" stroke-width="2"/>
    <!-- Wheels -->
    <circle cx="130" cy="260" r="28" fill="#1a1a1a" stroke="#0066ff" stroke-width="3"/>
    <circle cx="260" cy="260" r="28" fill="#1a1a1a" stroke="#0066ff" stroke-width="3"/>
    <circle cx="130" cy="260" r="16" fill="#666"/>
    <circle cx="260" cy="260" r="16" fill="#666"/>
    <text x="200" y="340" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#0052cc">🚗 TAXI</text>
  </g>
</svg>
  <circle cx="130" cy="145" r="8" fill="#ffa500"/>
  <text x="100" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f3a5f">Kurier</text>
</svg>
